name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Build Stockfish for Android (arm64)
        run: |
          git clone --depth 1 --branch sf_19 https://github.com/official-stockfish/Stockfish.git sf \
            || git clone --depth 1 https://github.com/official-stockfish/Stockfish.git sf
          export PATH="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd sf/src
          make -j4 build ARCH=armv8-dotprod COMP=ndk
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" stockfish
          mkdir -p ../../app/src/main/jniLibs/arm64-v8a
          cp stockfish ../../app/src/main/jniLibs/arm64-v8a/libstockfish.so

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ChessVision-APK
          path: app/build/outputs/apk/debug/app-debug.apk
